<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dance Coach — pose benchmark</title>
<meta name="robots" content="noindex">
<style>body{margin:0;background:#120a22;color:#fff;font:15px/1.4 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 14px 40px}button{min-height:48px;border:0;border-radius:14px;padding:0 16px;font-weight:800;background:#B8FF00;color:#111}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}td,th{border-bottom:1px solid #3b2a66;padding:6px 4px;text-align:start}video,canvas{max-width:100%}#cv{width:180px;border-radius:12px}a{color:#B8FF00}</style></head>
<body><main><a href="./">← Dance Coach</a><h1>Pose benchmark</h1>
<p>Runs each pose engine for a few seconds on your camera and measures inference time and screen FPS. Nothing is uploaded. Stand in view for best results.</p>
<p id="caps"></p><button id="go">▶ Run comparison (~1 min)</button> <span id="st"></span>
<div><canvas id="cv" width="360" height="480"></canvas></div>
<table><thead><tr><th>Option</th><th>Backend</th><th>Init s</th><th>Inference ms (median)</th><th>FPS</th><th>Pose found</th></tr></thead><tbody id="tb"></tbody></table>
<p id="best"></p><pre id="json" style="white-space:pre-wrap;font-size:11px;color:#cfc6e6"></pre>
<video id="cam" playsinline muted style="display:none"></video></main>
<script type="module" src="bench/bench.js"></script></body></html>
